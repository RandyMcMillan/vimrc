name: Install Vim, Neovim and recording dependencies
description: Restore, install and cache screenshot recording packages on Ubuntu.

runs:
  using: composite
  steps:
    - name: Set APT cache key
      id: apt-cache-key
      shell: bash
      run: |
        . /etc/os-release
        echo "release=$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Restore recording dependencies
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/screenshot-apt-cache/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.apt-cache-key.outputs.release }}-screenshot-apt-v1-vim-neovim-vhs-ttyd-ffmpeg-chromium-${{ steps.apt-cache-key.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.apt-cache-key.outputs.release }}-screenshot-apt-v1-vim-neovim-vhs-ttyd-ffmpeg-chromium-

    - name: Install Vim, Neovim and recording dependencies
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/screenshot-apt-cache"
        echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
        curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
        sudo apt-get update
        sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/screenshot-apt-cache" \
          -o APT::Keep-Downloaded-Packages=true \
          install -y vim neovim vhs ttyd ffmpeg chromium-browser

    - name: Save recording dependencies
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/screenshot-apt-cache/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
