name: Build Screenshot Image

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
    paths:
      - '.github/docker/screenshot/Dockerfile'
      - '.github/workflows/screenshot-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish screenshot image
      uses: docker/build-push-action@v6
      with:
        context: .github/docker/screenshot
        push: true
        tags: ghcr.io/randymcmillan/vimrc-screenshots:latest
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=screenshot-image
        cache-to: type=gha,mode=max,scope=screenshot-image
