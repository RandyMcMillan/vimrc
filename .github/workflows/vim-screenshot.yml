name: Capture Vim and Neovim Screenshots

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [ "master", "main" ]
    paths:
      - 'README.md'  # Trigger when relevant files change

jobs:
  screenshot:
    runs-on: ubuntu-latest

    # Ensure the workflow token has write permissions to commit back to the repo
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Vim and Neovim
      run: |
        sudo apt-get update
        sudo apt-get install -y vim neovim

    - name: Install VHS (Terminal Recorder)
      run: |
        echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
        curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
        sudo apt-get update
        sudo apt-get install -y vhs ttyd ffmpeg chromium-browser
    - name: Run VHS Tape Scripts
      run: |
        mkdir -p docs
        vhs < screenshot.tape
        test -s docs/vim-screenshot.png
        vhs < nvim-screenshot.tape
        test -s docs/nvim-screenshot.jpg

    - name: Commit and Push Screenshots
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if there are any changes to commit
        git status
        git add docs/vim-screenshot.png docs/nvim-screenshot.jpg
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: auto-generate Vim and Neovim screenshots [skip ci]"
          git push
        fi
