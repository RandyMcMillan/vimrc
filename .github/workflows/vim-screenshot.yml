name: Capture Vim and Neovim Screenshots

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches: [ "master", "main" ]
    paths:
      - 'README.md'  # Trigger when relevant files change

jobs:
  screenshot:
    runs-on: ubuntu-latest

    # Ensure the workflow token has write permissions to commit back to the repo
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set APT cache key
      id: apt-cache-key
      run: |
        . /etc/os-release
        echo "release=$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Restore recording dependencies
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/screenshot-apt-cache/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.apt-cache-key.outputs.release }}-screenshot-apt-v1-vim-neovim-vhs-ttyd-ffmpeg-chromium-${{ steps.apt-cache-key.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ubuntu-${{ steps.apt-cache-key.outputs.release }}-screenshot-apt-v1-vim-neovim-vhs-ttyd-ffmpeg-chromium-

    - name: Install Vim, Neovim and recording dependencies
      run: |
        mkdir -p "$RUNNER_TEMP/screenshot-apt-cache"
        echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
        curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
        sudo apt-get update
        sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/screenshot-apt-cache" \
          -o APT::Keep-Downloaded-Packages=true \
          install -y vim neovim vhs ttyd ffmpeg chromium-browser

    - name: Save recording dependencies
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/screenshot-apt-cache/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    - name: Run VHS Tape Scripts
      run: |
        mkdir -p docs
        vhs < screenshot.tape
        test -s docs/vim-screenshot.png
        vhs < nvim-screenshot.tape
        test -s docs/nvim-screenshot.png

    - name: Commit and Push Screenshots
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if there are any changes to commit
        git status
        git add docs/vim-screenshot.png docs/nvim-screenshot.png
        
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: auto-generate Vim and Neovim screenshots [skip ci]"
          git push
        fi
